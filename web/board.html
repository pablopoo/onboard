<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Onboard Board</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="drawing-page">
    <main id="board-app" class="board-shell">
      <section class="toolbar" aria-label="Presenter controls">
        <label class="toolbar-field">
          Surface
          <select name="surface" data-board-control="surface" aria-label="Board surface">
            <option value="whiteboard">Whiteboard</option>
            <option value="blueboard">Blueboard</option>
            <option value="blackboard">Blackboard</option>
            <option value="greenboard">Greenboard</option>
          </select>
        </label>
        <button type="button" data-board-control="pen" aria-pressed="true">Marker</button>
        <button type="button" data-board-control="eraser" aria-pressed="false">Eraser</button>
        <button type="button" data-board-control="pointer" aria-pressed="false">Pointer</button>
        <label class="toolbar-toggle">
          <input type="checkbox" data-board-control="ephemeral">
          Ephemeral
        </label>
        <button type="button" class="danger-button" data-board-control="clear">Clear all</button>
        <span class="toolbar-field" data-board-session aria-live="polite"></span>
      </section>
      <canvas id="board-canvas" class="board-canvas" data-board-canvas></canvas>
    </main>
    <script type="module" src="/board/board.js"></script>
  </body>
</html>
