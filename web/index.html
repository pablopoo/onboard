<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Pablo">
    <meta name="theme-color" content="#172033">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Onboard">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Onboard</title>
    <link rel="icon" href="/icons/onboard.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/onboard-180.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="home-page">
    <main id="home-app" class="home">
      <section class="home-hero" aria-labelledby="home-title">
        <p class="home-kicker">Local live board</p>
        <h1 id="home-title">Onboard</h1>
        <div class="home-actions" aria-label="Open relay surfaces">
          <a class="home-primary-link" href="/board">Open Board</a>
          <a href="/viewer">Open Viewer</a>
        </div>
      </section>

      <section class="share-panel" aria-labelledby="share-title">
        <div class="share-heading">
          <h2 id="share-title">Share</h2>
          <p data-share-status>Ready</p>
        </div>
        <div class="share-list" data-share-list></div>
      </section>
    </main>
    <script type="module" src="/home/home.js"></script>
  </body>
</html>
