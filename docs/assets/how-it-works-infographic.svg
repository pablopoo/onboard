<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1780" viewBox="0 0 1440 1780" role="img" aria-labelledby="title desc">
  <title id="title">Onboard drawing event flow infographic</title>
  <desc id="desc">Technical event flow from pointer input in the Board browser through the WebSocket transport, Go relay hub, snapshot storage, viewer subscriptions, and canvas rendering.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#172033"/>
    </marker>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="132%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <style>
      .h1{font:850 46px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .lead{font:400 19px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}
      .lane{font:850 22px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .step-num{font:850 24px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#fff}
      .step-title{font:850 21px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .step-copy{font:500 15px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#667085}
      .code{font:750 14px "SFMono-Regular",Consolas,Menlo,monospace;fill:#344054}
      .pill{font:800 13px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
    </style>
  </defs>

  <rect width="1440" height="1780" fill="#f7f4ee"/>
  <rect x="48" y="44" width="1344" height="1688" rx="34" fill="#fffaf1" stroke="#e6ded0"/>
  <text x="92" y="106" class="h1">Drawing Event Flow</text>
  <text x="92" y="138" class="lead">The app syncs structured board events through one local WebSocket relay.</text>

  <g>
    <rect x="92" y="188" width="370" height="54" rx="20" fill="#ffffff" stroke="#dfe7ef"/>
    <text x="277" y="222" text-anchor="middle" class="lane">Board browser</text>
    <rect x="535" y="188" width="370" height="54" rx="20" fill="#172033"/>
    <text x="720" y="222" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui" font-size="22" font-weight="850" fill="#ffffff">Go relay binary</text>
    <rect x="978" y="188" width="370" height="54" rx="20" fill="#ffffff" stroke="#dfe7ef"/>
    <text x="1163" y="222" text-anchor="middle" class="lane">Viewer browser</text>
  </g>

  <path d="M277 260V1494" stroke="#d9e2ec" stroke-width="4" stroke-dasharray="9 12"/>
  <path d="M720 260V1494" stroke="#d9e2ec" stroke-width="4" stroke-dasharray="9 12"/>
  <path d="M1163 260V1494" stroke="#d9e2ec" stroke-width="4" stroke-dasharray="9 12"/>

  <g filter="url(#shadow)">
    <rect x="112" y="300" width="330" height="112" rx="22" fill="#ffffff" stroke="#dfe7ef"/>
    <circle cx="150" cy="338" r="22" fill="#172033"/>
    <text x="150" y="347" text-anchor="middle" class="step-num">1</text>
    <text x="184" y="334" class="step-title">Pointer input</text>
    <text x="184" y="362" class="step-copy">Board captures pointerdown, move,</text>
    <text x="184" y="384" class="step-copy">coalesced samples, and pointerup.</text>
  </g>

  <path d="M277 420V476" stroke="#172033" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="112" y="494" width="330" height="132" rx="22" fill="#ffffff" stroke="#dfe7ef"/>
    <circle cx="150" cy="532" r="22" fill="#172033"/>
    <text x="150" y="541" text-anchor="middle" class="step-num">2</text>
    <text x="184" y="528" class="step-title">Normalize event</text>
    <text x="184" y="556" class="step-copy">Board creates protocol events:</text>
    <text x="184" y="584" class="code">stroke:start</text>
    <text x="184" y="606" class="code">stroke:point / stroke:end</text>
  </g>

  <path d="M277 636V692" stroke="#172033" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="112" y="710" width="330" height="132" rx="22" fill="#ffffff" stroke="#dfe7ef"/>
    <circle cx="150" cy="748" r="22" fill="#172033"/>
    <text x="150" y="757" text-anchor="middle" class="step-num">3</text>
    <text x="184" y="744" class="step-title">Apply locally first</text>
    <text x="184" y="772" class="step-copy">Shared reducer updates local state,</text>
    <text x="184" y="794" class="step-copy">then canvas renders immediately.</text>
    <text x="184" y="820" class="code">applyBoardEvent -> renderBoardState</text>
  </g>

  <path d="M442 776H535" stroke="#172033" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="458" y="736" width="58" height="32" rx="12" fill="#ffffff" stroke="#d7e0ea"/>
  <text x="487" y="757" text-anchor="middle" class="pill">JSON</text>

  <g filter="url(#shadow)">
    <rect x="555" y="710" width="330" height="132" rx="22" fill="#ffffff" stroke="#dfe7ef"/>
    <circle cx="593" cy="748" r="22" fill="#172033"/>
    <text x="593" y="757" text-anchor="middle" class="step-num">4</text>
    <text x="627" y="744" class="step-title">Relay endpoint</text>
    <text x="627" y="772" class="step-copy">/ws/relay upgrades WebSocket,</text>
    <text x="627" y="794" class="step-copy">checks role, read limit, and presenter lock.</text>
    <text x="627" y="820" class="code">role=board</text>
  </g>

  <path d="M720 852V908" stroke="#172033" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="555" y="926" width="330" height="154" rx="22" fill="#ffffff" stroke="#dfe7ef"/>
    <circle cx="593" cy="964" r="22" fill="#172033"/>
    <text x="593" y="973" text-anchor="middle" class="step-num">5</text>
    <text x="627" y="960" class="step-title">Hub stores state</text>
    <text x="627" y="988" class="step-copy">internal/hub appends accepted events,</text>
    <text x="627" y="1010" class="step-copy">maintains snapshot state, and tracks</text>
    <text x="627" y="1032" class="step-copy">viewer subscriptions.</text>
    <text x="627" y="1058" class="code">SubscribeWithSnapshotRole</text>
  </g>

  <path d="M885 1002H978" stroke="#172033" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="904" y="962" width="54" height="32" rx="12" fill="#ffffff" stroke="#d7e0ea"/>
  <text x="931" y="983" text-anchor="middle" class="pill">fanout</text>

  <g filter="url(#shadow)">
    <rect x="998" y="926" width="330" height="132" rx="22" fill="#ffffff" stroke="#dfe7ef"/>
    <circle cx="1036" cy="964" r="22" fill="#172033"/>
    <text x="1036" y="973" text-anchor="middle" class="step-num">6</text>
    <text x="1070" y="960" class="step-title">Viewer receives events</text>
    <text x="1070" y="988" class="step-copy">Transport emits each event to</text>
    <text x="1070" y="1010" class="step-copy">createViewerController.</text>
    <text x="1070" y="1036" class="code">onEvent(event)</text>
  </g>

  <path d="M1163 1068V1124" stroke="#172033" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="998" y="1142" width="330" height="132" rx="22" fill="#ffffff" stroke="#dfe7ef"/>
    <circle cx="1036" cy="1180" r="22" fill="#172033"/>
    <text x="1036" y="1189" text-anchor="middle" class="step-num">7</text>
    <text x="1070" y="1176" class="step-title">Shared render path</text>
    <text x="1070" y="1204" class="step-copy">Viewer uses the same reducer and</text>
    <text x="1070" y="1226" class="step-copy">canvas renderer as the Board.</text>
    <text x="1070" y="1252" class="code">board-state.js + canvas-renderer.js</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="555" y="1160" width="330" height="154" rx="22" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="720" y="1206" text-anchor="middle" class="step-title">Late Viewer path</text>
    <text x="594" y="1238" class="step-copy">When a Viewer connects after writing exists,</text>
    <text x="594" y="1260" class="step-copy">the hub sends the current snapshot first.</text>
    <text x="594" y="1288" class="code">board:restore -> live stream</text>
  </g>

  <path d="M885 1238H978" stroke="#172033" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="904" y="1198" width="72" height="32" rx="12" fill="#ffffff" stroke="#d7e0ea"/>
  <text x="940" y="1219" text-anchor="middle" class="pill">snapshot</text>

  <rect x="192" y="1518" width="1056" height="138" rx="28" fill="#172033"/>
  <text x="236" y="1570" font-family="Inter,ui-sans-serif,system-ui" font-size="25" font-weight="850" fill="#ffffff">Important behavior</text>
  <text x="236" y="1608" font-family="Inter,ui-sans-serif,system-ui" font-size="17" font-weight="500" fill="#cbd5e1">One active Board presenter is allowed. Viewers are unlimited. Board state is in memory and resets when the binary restarts.</text>
  <text x="236" y="1642" font-family="Inter,ui-sans-serif,system-ui" font-size="17" font-weight="500" fill="#cbd5e1">The Viewer never receives toolbar controls. It only receives board events, pointer events, and unexpired fade strokes.</text>
</svg>
